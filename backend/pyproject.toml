[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-qa-assistant"
version = "0.1.0"
description = "Fine-Tuned Medical Q&A Assistant with RAG and LoRA/QLoRA"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "sqlalchemy>=2.0.0",
  "greenlet>=3.0.0",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.0",
  "pgvector>=0.3.0",
  "alembic>=1.13.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24.0",
  "numpy>=1.24.0",
  "sentence-transformers>=3.0.0",
  "torch>=2.2.0",
  "transformers>=4.44.0",
  "datasets>=2.20.0",
  "accelerate>=0.33.0",
  "peft>=0.12.0",
  "trl>=0.9.0",
  "bitsandbytes>=0.43.0; platform_system=='Linux'",
  "pyyaml>=6.0",
  "tqdm>=4.66.0",
  "rouge-score>=0.1.2",
  "nltk>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
]
